<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Task Workspace</title>
  <style>
    :root {
      /* Base colors updated from the image provided */
      --bg-color: #1a1a1a;        /* Main dark background */
      --card-bg: #2a2a2a;         /* Inner card/container */
      --primary: #4caf50;          /* The specific green for 'Add' button and active filter */
      --primary-hover: #43a047;   /* Slightly darker green for hover */
      --text-main: #ffffff;        /* White text for header/add button */
      --text-muted: #a0a0a0;      /* Lighter grey for subtitle and inactive filters */
      --input-bg: #3a3a3a;        /* Background for inputs/select */
      --border-color: #444444;    /* Border color to distinguish inputs and select */
      --task-text: #cccccc;       /* Light grey for task items */
      --task-item-border: #333333;/* Border for each task item */
      --hover-bg: #333333;        /* Hover background for task items */
      
      --danger: #ef4444;          /* Red for delete (default professional) */
      --shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 40px 16px; min-height: 100vh; }
    
    .app-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 24px; }
    header { margin-bottom: 24px; text-align: center; } /* Center text like in image */
    header h1 { font-size: 1.75rem; font-weight: 700; color: var(--text-main); }
    header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: var(--primary); }
    input[type="text"]::placeholder { color: var(--text-muted); }

    select { padding: 10px 14px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); border-radius: 6px; font-size: 0.9rem; outline: none; cursor: pointer; }
    
    button.btn-add { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
    button.btn-add:hover { background: var(--primary-hover); }

    .filters { display: flex; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .filter-btn { background: none; border: none; color: var(--text-muted); font-size: 0.875rem; font-weight: 600; cursor: pointer; padding: 6px 12px; border-radius: 4px; transition: color 0.2s, background 0.2s; }
    .filter-btn.active { color: var(--text-main); background: var(--primary); }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid var(--task-item-border); border-radius: 6px; background-color: var(--input-bg); transition: background 0.15s; }
    .task-item:hover { background-color: var(--hover-bg); }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--text-muted); }

    .task-left { display: flex; align-items: center; gap: 14px; }
    .task-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    .task-text { font-size: 0.95rem; color: var(--task-text); }

    .badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
    .badge-high { background: #fee2e2; color: #991b1b; }
    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-low { background: #e0e7ff; color: #3730a3; }

    .btn-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; padding: 0 4px; }
    .btn-delete:hover { color: var(--danger); }
    
    .empty-state { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 24px 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Todo List</h1>
      <p>Focus on what matters most.</p>
    </header>

    <form id="task-form" class="input-group">
      <input type="text" id="task-input" placeholder="Add a new task..." required autocomplete="off">
      <select id="priority-input">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks_revised')) || [];
    let currentFilter = 'all';

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const priorityInput = document.getElementById('priority-input');
    const taskList = document.getElementById('task-list');

    function saveTasks() {
      localStorage.setItem('tasks_revised', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';
      
      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<li class="empty-state">No tasks to display</li>`;
        return;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        const priorityClass = `badge-${task.priority.toLowerCase()}`;

        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span class="task-text">${escapeHtml(task.text)}</span>
            <span class="badge ${priorityClass}">${task.priority}</span>
          </div>
          <button class="btn-delete" onclick="deleteTask(${task.id})" title="Delete task">&times;</button>
        `;
        taskList.appendChild(li);
      });
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now(),
        text: text,
        priority: priorityInput.value,
        completed: false
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      taskInput.value = '';
    });

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function setFilter(filter, element) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderTasks();
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.innerText = string;
      return div.innerHTML;
    }

    renderTasks();
  </script>
</body>
</html>
